<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f3f9;--surface:#fff;--surface2:#e9ecf5;--line:#dde1ee;
  --ink:#151a33;--muted:#66708a;--faint:#9aa3bb;
  --hero:#23286b;--primary:#23286b;--on-primary:#fff;
  --income:#0f8a5f;--expense:#d33a4c;--warn:#c77700;
  --victor:#2d6cdf;--cris:#d6317a;
  --income-bg:rgba(15,138,95,.11);--expense-bg:rgba(211,58,76,.10);--warn-bg:rgba(199,119,0,.12);
  --r-lg:22px;--r-md:16px;--r-sm:12px;
  --nav-h:68px;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0d1020;--surface:#171b33;--surface2:#222850;--line:#2b3262;
    --ink:#eceffa;--muted:#9aa3c4;--faint:#646d92;
    --hero:#333aa8;--primary:#6a72ff;--on-primary:#0d1020;
    --income:#38d39a;--expense:#ff7a8a;--warn:#f3b04a;
    --victor:#6c9cff;--cris:#ff6fae;
    --income-bg:rgba(56,211,154,.13);--expense-bg:rgba(255,122,138,.13);--warn-bg:rgba(243,176,74,.14);
  }
}
:root[data-theme=dark]{
  --bg:#0d1020;--surface:#171b33;--surface2:#222850;--line:#2b3262;
  --ink:#eceffa;--muted:#9aa3c4;--faint:#646d92;
  --hero:#333aa8;--primary:#6a72ff;--on-primary:#0d1020;
  --income:#38d39a;--expense:#ff7a8a;--warn:#f3b04a;
  --victor:#6c9cff;--cris:#ff6fae;
  --income-bg:rgba(56,211,154,.13);--expense-bg:rgba(255,122,138,.13);--warn-bg:rgba(243,176,74,.14);
}
html{-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
.hide-values .money{filter:blur(8px);user-select:none}

/* topo */
.top{position:sticky;top:0;z-index:50;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.top-row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand img{width:36px;height:34px;object-fit:contain}
.brand b{font-size:1rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--surface2)}
.month-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.month-label{display:flex;align-items:center;gap:2px;font-size:1.05rem;font-weight:700;padding:6px 10px;border-radius:12px}
.month-label:active{background:var(--surface2)}
.sync{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);min-width:0}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0}
.sync.ok i{background:var(--income)}.sync.busy i{background:var(--warn);animation:blink 1s infinite}.sync.err i{background:var(--expense)}
@keyframes blink{50%{opacity:.3}}

.view{display:none;padding:6px 16px 0}
.view.on{display:block}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;border:1px solid var(--line)}
.card h3{font-size:.95rem;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.link{font-size:.8rem;font-weight:600;color:var(--primary)}
.muted{color:var(--muted)}.small{font-size:.8rem}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:.9rem}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}

/* login banner */
.banner{margin:4px 16px 8px;padding:14px 16px;border-radius:var(--r-md);background:var(--warn-bg);display:flex;align-items:center;gap:12px;justify-content:space-between}
.banner.hidden{display:none}
.banner p{font-size:.85rem;flex:1}.banner b{display:block}

/* herói */
.hero{background:var(--hero);color:#fff;border-radius:28px;padding:20px 20px 18px}
.hero small{opacity:.75;font-size:.82rem;font-weight:500}
.hero .big{font-size:2.2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:2px 0 14px}
.hero .big.neg{color:#ffc2c9}
.hero-cols{display:flex;gap:10px}
.hero-cols div{flex:1;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.hero-cols span{display:block;font-size:.72rem;opacity:.8}
.hero-cols b{font-size:1.02rem;font-weight:700}
.meter{height:7px;background:rgba(255,255,255,.2);border-radius:6px;margin-top:14px;overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:6px}
.hero .hint{font-size:.76rem;opacity:.8;margin-top:6px}

/* alertas */
.alert{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--r-md);font-size:.86rem;text-align:left;width:100%}
.alert.warn{background:var(--warn-bg)}.alert.bad{background:var(--expense-bg)}
.alert b{font-weight:700}

/* linhas de lançamento */
.row{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.dot-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.2rem;flex-shrink:0}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main span{font-size:.76rem;color:var(--muted)}
.row-end{text-align:right;flex-shrink:0}
.row-end b{display:block;font-weight:700;font-size:.93rem}
.row-end b.receita{color:var(--income)}.row-end b.gasto{color:var(--ink)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;color:transparent}
.chk svg{width:16px;height:16px;stroke-width:3}
.chk.on{background:var(--income);border-color:var(--income);color:#fff}
.tag{display:inline-block;font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:8px;margin-left:4px;vertical-align:1px}
.tag.late{background:var(--expense-bg);color:var(--expense)}
.tag.soon{background:var(--warn-bg);color:var(--warn)}
.who{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.daysep{font-size:.78rem;font-weight:700;color:var(--muted);padding:14px 4px 4px}

/* casal */
.split-bar{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--surface2);margin:10px 0 8px}
.split-bar i{display:block;height:100%}
.split-names{display:flex;justify-content:space-between;font-size:.84rem}
.split-names b{display:block;font-size:1rem}
.settle{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface2);font-size:.86rem;font-weight:600;text-align:center}

/* controles */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px;color:var(--muted)}
.search input{flex:1;border:none;background:none;outline:none;height:100%;color:var(--ink)}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 6px;border-radius:11px;font-size:.84rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,25,60,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 13px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.sum-line{font-size:.8rem;color:var(--muted);padding:2px 4px}

/* análises */
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{width:150px;height:150px;flex-shrink:0;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut small{font-size:.7rem;color:var(--muted)}.donut b{font-size:1rem}
.legend{flex:1;min-width:0;font-size:.8rem}
.legend div{display:flex;align-items:center;gap:7px;padding:3px 0}
.legend i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:130px;padding-top:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-pair{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.bar-pair i{display:block;width:42%;max-width:18px;border-radius:5px 5px 2px 2px;min-height:2px}
.bar-col small{font-size:.7rem;color:var(--muted)}.bar-col.cur small{color:var(--ink);font-weight:800}
.key{display:flex;gap:14px;font-size:.74rem;color:var(--muted);margin-top:8px}
.key i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}

/* metas */
.prog{height:9px;border-radius:6px;background:var(--surface2);overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;border-radius:6px;background:var(--income)}
.prog i.warn{background:var(--warn)}.prog i.bad{background:var(--expense)}
.bud-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem;font-weight:600;width:100%;text-align:left}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.goal-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.goal h4{font-size:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:14px;font-weight:700;font-size:.92rem}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--expense-bg);color:var(--expense)}
.btn.block{width:100%}
.btn.small{padding:8px 14px;font-size:.82rem;border-radius:12px}

/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;pointer-events:none}
.nav-in{pointer-events:auto;width:100%;max-width:520px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;background:var(--surface);border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;font-weight:600;color:var(--faint)}
.nav button.on{color:var(--primary)}
.fab{width:58px;height:58px;border-radius:50%;background:var(--primary);color:var(--on-primary)!important;margin:-22px auto 0;box-shadow:0 6px 18px rgba(35,40,107,.35);display:grid!important;place-items:center}
.fab svg{width:28px;height:28px;stroke-width:2.6}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,12,30,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
.backdrop.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 18px 0;animation:up .22s ease-out}
.sheet::after{content:'';display:block;height:calc(20px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grip{width:40px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:1.15rem;font-weight:800;margin-bottom:14px}
.field{margin-top:14px}
.field>label,.lbl{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field input[type=date],.field input[type=number],.field input[type=color]{width:100%;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--bg);padding:0 14px;outline:none}
.field input:focus{border-color:var(--primary)}
.amount-box{display:flex;align-items:baseline;gap:8px;justify-content:center;padding:6px 0 2px}
.amount-box span{font-size:1.3rem;font-weight:700;color:var(--muted)}
.amount-box input{border:none;background:none;outline:none;font-size:2.4rem;font-weight:800;width:62%;text-align:left;letter-spacing:-.03em;color:var(--ink)}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:14px;border:2px solid transparent;background:var(--bg);font-size:.68rem;font-weight:600;text-align:center;line-height:1.15}
.cat-opt span{font-size:1.35rem}
.cat-opt.on{border-color:var(--primary);background:var(--surface2)}
.who-pick{display:flex;gap:8px}
.who-pick button{flex:1;padding:11px;border-radius:13px;background:var(--bg);border:2px solid transparent;font-weight:700;font-size:.9rem}
.who-pick button.on{border-color:currentColor;background:var(--surface2)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;font-size:.9rem;font-weight:600}
.switch-row small{display:block;font-weight:400;color:var(--muted);font-size:.76rem}
.sw{position:relative;width:48px;height:28px;flex-shrink:0}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:20px;transition:.2s}
.sw i::before{content:'';position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--income)}
.sw input:checked+i::before{transform:translateX(20px)}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .btn{flex:1}
.menu-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:14px 4px;font-weight:600;text-align:left;border-top:1px solid var(--line)}
.menu-item small{color:var(--muted);font-weight:500}
.month-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.month-grid button{padding:14px 0;border-radius:14px;background:var(--bg);font-weight:700}
.month-grid button.on{background:var(--primary);color:var(--on-primary)}
.month-grid button.now{border:2px solid var(--primary)}
.year-row{display:flex;align-items:center;justify-content:center;gap:18px;font-weight:800;font-size:1.1rem;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);
  padding:11px 18px;border-radius:24px;font-size:.84rem;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.row-btn{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;padding:0}
.row .chk{margin-left:4px}
.row-main span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end .tag{margin:2px 0 0;display:inline-block}
.sheet .actions{position:sticky;bottom:0;background:var(--surface);padding:12px 0 calc(16px + env(safe-area-inset-bottom));margin-top:8px;z-index:2}
</style>
</head>

function stats(es){
  let rec=0, gas=0, pend=0;
  for (const e of es){ if (e.tipo==='receita') rec+=e.valor; else { gas+=e.valor; if(!e.pago) pend+=e.valor; } }
  return {rec, gas, saldo:rec-gas, pend};
}
function spentByCat(es){
  const o = {}; for (const e of es) if (e.tipo==='gasto') o[e.cat] = (o[e.cat]||0)+e.valor; return o;
}
function splitCalc(es){
  const sh = es.filter(e=>e.tipo==='gasto' && e.quem && e.dividir);
  const v = sh.filter(e=>e.quem==='victor').reduce((s,e)=>s+e.valor,0);
  const c = sh.filter(e=>e.quem==='cris').reduce((s,e)=>s+e.valor,0);
  return {v, c, tot:v+c, diff: v-(v+c)/2};
}

  const meta = await S().get({spreadsheetId:SHEET_ID, fields:'sheets.properties.title'});
  tabs.clear(); (meta.result.sheets||[]).forEach(s=>tabs.add(s.properties.title)); tabsKnown = true;
}
async function ensureTab(title){
  if (!tabsKnown) await refreshTabs();
  if (!tabs.has(title)){
    try{ await S().batchUpdate({spreadsheetId:SHEET_ID, resource:{requests:[{addSheet:{properties:{title}}}]}}); }
    catch(e){ if (errCode(e)!==400) throw e; }
    tabs.add(title);
  }
}
async function ensureHeader(title){
  if (headed.has(title)) return;
  await S().values.update({spreadsheetId:SHEET_ID, range:`'${title}'!A1:J1`, valueInputOption:'RAW', resource:{values:[HEAD]}});
  headed.add(title);
}
async function fetchMonth(y,m){
  try{
    const r = await S().values.get({spreadsheetId:SHEET_ID, range:`'${tabName(y,m)}'!A2:J1000`});
    return (r.result.values||[]).filter(r=>r&&r.length>=5).map(rowToEntry).filter(e=>e.date&&e.desc);
  }catch(e){ const c = errCode(e); if (c===400||c===404) return null; throw e; }
}
async function putRows(y,m,es){
  const title = tabName(y,m);
  await ensureTab(title); await ensureHeader(title);
  const rows = es.map(entryToRow);
  if (rows.length) await S().values.update({spreadsheetId:SHEET_ID, range:`'${title}'!A2`, valueInputOption:'RAW', resource:{values:rows}});
  await S().values.clear({spreadsheetId:SHEET_ID, range:`'${title}'!A${rows.length+2}:J1000`});
}
async function createMonthTab(y,m){
  const title = tabName(y,m);
  await ensureTab(title); await ensureHeader(title);
  const [py,pm] = addMonths(y,m,-1);
  const prev = (await fetchMonth(py,pm)) || [];
  const carried = prev.filter(e=>e.recorrente).map(e=>({
    ...e, id: baseOf(e.id)+'_r'+y+pad(m+1), pago:false,
    date: ymd(y,m,Math.min(parseInt(e.date.slice(8,10))||1, daysIn(y,m)))
  }));
  if (carried.length) await putRows(y,m,carried);
  return carried;
}
async function loadMonth(y,m){
  const k = key(y,m);
  if (dirty.has(k)) await flush();
  let rows = await fetchMonth(y,m);
  if (rows===null) rows = await createMonthTab(y,m);
  setEntries(y,m,rows); loaded.add(k); return rows;
}
const ensureLoaded = async (y,m) => { if (!loaded.has(key(y,m))) await loadMonth(y,m); };

/* configuração compartilhada (categorias, limites, metas) na aba "Config" */
async function loadConfig(){
  try{
    const r = await S().values.get({spreadsheetId:SHEET_ID, range:"'Config'!A1:B10"});
    for (const [k,v] of (r.result.values||[])){
      try{
        const val = JSON.parse(v);
        if (k==='cats' && Array.isArray(val) && val.length) CATS = normCats(val);
        if (k==='budgets' && val && typeof val==='object') cfg.budgets = val;
        if (k==='goals' && Array.isArray(val)) cfg.goals = val;
      }catch{}
    }
    saveCfgLocal();
  }catch(e){ /* aba ainda não existe: usa o que está no aparelho */ }
}
async function saveConfigRemote(){
  await ensureTab('Config');
  await S().values.update({spreadsheetId:SHEET_ID, range:"'Config'!A1", valueInputOption:'RAW',
    resource:{values:[['cats',JSON.stringify(CATS)],['budgets',JSON.stringify(cfg.budgets)],['goals',JSON.stringify(cfg.goals)]]}});
}
function commitCfg(){ saveCfgLocal(); cfgDirty = true; scheduleFlush(); }

/* fila de gravação */
function scheduleFlush(){ setSync('busy','Salvando…'); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 700); }
function markDirty(y,m){ dirty.add(key(y,m)); scheduleFlush(); }
function flush(){ clearTimeout(flushTimer); chain = chain.then(doFlush).catch(()=>{}); return chain; }
async function doFlush(){
  if (!dirty.size && !cfgDirty) return;
  if (!isAuthenticated){ setSync('err','Sem conexão'); return; }
  try{
    while (dirty.size){
      const k = dirty.values().next().value;
      const y = +k.slice(0,4), m = +k.slice(5)-1;
      if (!loaded.has(k)) { dirty.delete(k); continue; }
      await putRows(y,m,getEntries(y,m));
      dirty.delete(k);
    }
    if (cfgDirty){ await saveConfigRemote(); cfgDirty = false; }
    setSync('ok','Salvo '+hm());
  }catch(e){
    if (errCode(e)===401) lostSession(); else { setSync('err','Erro ao salvar'); toast('Não foi possível salvar. Toque em Sincronizar para tentar de novo.'); }
  }
}

/* ===== Login Google (token guardado no aparelho) ===== */
const saveToken = r => { lsSet('vc_access_token', r.access_token); lsSet('vc_token_expires', String(Date.now()+(r.expires_in||3599)*1000)); };
const loadToken = () => { const t = lsGet('vc_access_token',''), x = parseInt(lsGet('vc_token_expires','0')); return t && Date.now() < x-300000 ? t : null; };
const clearToken = () => { try{ localStorage.removeItem('vc_access_token'); localStorage.removeItem('vc_token_expires'); }catch{} };
function whenGoogle(){
  return new Promise(res => { let n=0; const t = setInterval(()=>{ if (window.google && google.accounts && google.accounts.oauth2){ clearInterval(t); res(true);} else if(++n>100){ clearInterval(t); res(false);} },100); });
}
async function initTokenClient(cb){
  if (!(await whenGoogle())) return false;
  tokenClient = google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID, scope:SCOPES, callback:cb}); return true;
}
function gapiLoaded(){
  gapi.load('client', async () => {
    await gapi.client.init({});
    await gapi.client.load('https://sheets.googleapis.com/$discovery/rest?version=v4');
    gapiReady = true; tryAutoLogin();
  });
}
window.gapiLoaded = gapiLoaded;
async function tryAutoLogin(){
  const t = loadToken();
  if (t){ gapi.client.setToken({access_token:t}); isAuthenticated = true; onAuth(false); scheduleRenewal(); return; }
  setSync('busy','Reconectando…');
  const ok = await initTokenClient(r => {
    if (!r.error){ saveToken(r); gapi.client.setToken({access_token:r.access_token}); isAuthenticated = true; onAuth(false); scheduleRenewal(); }
    else lostSession(true);
  });
  if (!ok) return lostSession(true);
  try{ tokenClient.requestAccessToken({prompt:''}); }catch{ lostSession(true); }
}
async function loginClick(){
  if (!gapiReady){ toast('Aguarde o carregamento…'); return; }
  const ok = await initTokenClient(r => {
    if (r.error){ setSync('err','Erro no login'); toast('Não foi possível entrar: '+r.error); return; }
    saveToken(r); gapi.client.setToken({access_token:r.access_token}); isAuthenticated = true; onAuth(true); scheduleRenewal();
  });
  if (ok) tokenClient.requestAccessToken({prompt:''});
}
function scheduleRenewal(){
  const ms = Math.max(0, parseInt(lsGet('vc_token_expires','0')) - Date.now() - 300000);
  setTimeout(async () => {
    const ok = await initTokenClient(r => { if (!r.error){ saveToken(r); gapi.client.setToken({access_token:r.access_token}); scheduleRenewal(); } else lostSession(); });
    if (ok) try{ tokenClient.requestAccessToken({prompt:''}); }catch{}
  }, ms);
}
function lostSession(quiet){
  clearToken(); isAuthenticated = false; showBanner(true); setSync('err','Desconectado');
  if (!quiet) toast('Sessão expirada. Entre de novo para continuar.');
}
function signOut(){
  clearToken(); isAuthenticated = false; try{ gapi.client.setToken(null); }catch{}
  showBanner(true); setSync('err','Desconectado'); closeSheet(); toast('Você saiu da conta');
}
const showBanner = on => $('#loginBanner').classList.toggle('hidden', !on);
async function onAuth(welcome){
  showBanner(false); setSync('busy','Carregando…');
  try{
    await loadConfig();
    await loadMonth(year,month);
    setSync('ok','Atualizado '+hm()); if (welcome) toast('Conectado');
  }catch(e){
    if (errCode(e)===401) lostSession(); else { setSync('err','Erro ao carregar'); toast('Erro ao carregar: '+((e.result&&e.result.error&&e.result.error.message)||e.message||e)); }
  }
  render();
}
function needAuth(){
  if (isAuthenticated) return true;
  showBanner(true); toast('Entre com a conta Google para salvar'); window.scrollTo({top:0,behavior:'smooth'}); return false;
}
async function syncNow(){
  if (!needAuth()) return;
  setSync('busy','Sincronizando…');
  try{ await flush(); loaded.delete(key(year,month)); await loadConfig(); await loadMonth(year,month); setSync('ok','Atualizado '+hm()); render(); }
  catch(e){ if (errCode(e)===401) lostSession(); else setSync('err','Erro ao sincronizar'); }
}
function setSync(state,label){ const el = $('#sync'); el.className = 'sync '+state; $('#syncLabel').textContent = label; }

/* ===== Navegação ===== */
async function goMonth(y,m){
  year = y; month = m; ext.cat = 'all'; render();
  if (isAuthenticated){
    setSync('busy','Carregando…');
    try{ await loadMonth(y,m); if (year===y && month===m){ setSync('ok','Atualizado '+hm()); render(); } }
    catch(e){ if (errCode(e)===401) lostSession(); else setSync('err','Erro ao carregar'); }

}

/* ===== Linhas de lançamento ===== */
function dueTag(e){
  if (e.tipo!=='gasto' || e.pago) return '';
  const t = todayStr(); const d = new Date(); d.setDate(d.getDate()+1);
  if (e.date < t) return '<span class="tag late">Atrasada</span>';
  if (e.date === t) return '<span class="tag soon">Vence hoje</span>';
  if (e.date === ymd(d.getFullYear(),d.getMonth(),d.getDate())) return '<span class="tag soon">Amanhã</span>';
  return '';
}
function rowHtml(e, withDate){
  const c = catOf(e.cat);
  const who = e.quem ? `<span class="who" style="background:${PEOPLE[e.quem].color}"></span>${PEOPLE[e.quem].name} · ` : '';
  const dt = withDate ? ` · ${e.date.slice(8,10)}/${e.date.slice(5,7)}` : '';
  const rec = e.recorrente ? ' · 🔁 fixa' : (/_p\d+$/.test(e.id)?' · 💳 parcela':'');
  return `<div class="row">
    <button class="row-btn" data-act="edit" data-id="${esc(e.id)}">
      <span class="dot-ic" style="background:${c.color}22">${c.emoji}</span>
      <span class="row-main"><b>${esc(e.desc)}</b><span>${who}${esc(c.label)}${rec}${dt}</span></span>
      <span class="row-end"><b class="${e.tipo} money">${e.tipo==='receita'?'+':''}${fmt(e.valor)}</b>${dueTag(e)}</span>
    </button>
    <button class="chk ${e.pago?'on':''}" data-act="pay" data-id="${esc(e.id)}" aria-label="${e.pago?'Marcar como pendente':(e.tipo==='receita'?'Marcar como recebido':'Marcar como pago')}">${ic('check')}</button>
  </div>`;
}

/* ===== Início ===== */
function renderHome(){
  const es = entries(), s = stats(es), t = todayStr();
  const pct = s.rec>0 ? Math.min(100, Math.round(s.gas/s.rec*100)) : (s.gas>0?100:0);
  const late = es.filter(e=>e.tipo==='gasto'&&!e.pago&&e.date<t);
  const topay = es.filter(e=>e.tipo==='gasto'&&!e.pago).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  const spent = spentByCat(es);
  const budAlerts = Object.keys(cfg.budgets).filter(id=>cfg.budgets[id]>0 && (spent[id]||0)/cfg.budgets[id]>=.8)
    .map(id=>({id, p:Math.round((spent[id]||0)/cfg.budgets[id]*100)})).sort((a,b)=>b.p-a.p).slice(0,3);
  const alerts = [];
  if (late.length) alerts.push(`<button class="alert bad" data-act="go-pend"><span>⏰</span><span><b>${late.length} ${late.length>1?'contas atrasadas':'conta atrasada'}</b><br>${money(late.reduce((a,e)=>a+e.valor,0))} para pagar</span></button>`);
  budAlerts.forEach(a => { const c = catOf(a.id);
    alerts.push(`<button class="alert ${a.p>=100?'bad':'warn'}" data-act="go-metas"><span>${c.emoji}</span><span><b>${esc(c.label)}: ${a.p}% do limite</b><br>${a.p>=100?'O limite do mês foi ultrapassado':'Perto do limite do mês'}</span></button>`); });
  const sp = splitCalc(es);
  let split;
  if (sp.tot>0){
    const vp = Math.round(sp.v/sp.tot*100);
    const msg = Math.abs(sp.diff)<0.005 ? 'Vocês estão quites neste mês'
      : sp.diff>0 ? `Cris deve ${money(sp.diff)} para Victor` : `Victor deve ${money(-sp.diff)} para Cris`;
    split = `<div class="split-bar"><i style="width:${vp}%;background:var(--victor)"></i><i style="width:${100-vp}%;background:var(--cris)"></i></div>
      <div class="split-names"><div><b class="money">${fmt(sp.v)}</b><span class="muted">Victor pagou</span></div><div style="text-align:right"><b class="money">${fmt(sp.c)}</b><span class="muted">Cris pagou</span></div></div>
      <div class="settle">${msg}</div>`;
  } else split = `<p class="muted small">Ao lançar um gasto, escolha quem pagou e deixe “Dividir ao meio” ligado. Aqui aparece quem deve quanto no fim do mês.</p>`;
  const last = es.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  $('#v-home').innerHTML = `<div class="stack">
    <div class="hero">
      <small>Sobrou em ${MONTHS_FULL[month]}</small>
      <div class="big money ${s.saldo<0?'neg':''}">${fmt(s.saldo)}</div>
      <div class="hero-cols"><div><span>Entrou</span><b class="money">${fmt(s.rec)}</b></div><div><span>Saiu</span><b class="money">${fmt(s.gas)}</b></div></div>
      <div class="meter"><i style="width:${pct}%"></i></div>
      <div class="hint">${s.rec>0?`Você gastou ${pct}% do que recebeu`:(s.gas>0?'Nenhuma receita lançada ainda':'Nada lançado neste mês')}${s.pend>0?` · ainda falta pagar <span class="money">${fmt(s.pend)}</span>`:''}</div>
    </div>
    ${alerts.join('')}
    <div class="card"><h3>Entre nós</h3>${split}</div>
    <div class="card"><h3>Contas a pagar ${topay.length?'<button class="link" data-act="go-pend">Ver todas</button>':''}</h3>
      ${topay.length ? topay.map(e=>rowHtml(e,true)).join('') : '<p class="muted small">Tudo pago por aqui. 🎉</p>'}</div>
    <div class="card"><h3>Últimos lançamentos ${es.length?'<button class="link" data-act="go-extrato">Ver extrato</button>':''}</h3>
      ${last.length ? last.map(e=>rowHtml(e,true)).join('') : `<div class="empty"><b>Nenhum lançamento em ${MONTHS_FULL[month]}</b>Toque no botão + para registrar o primeiro.</div>`}</div>
  </div>`;
}

/* ===== Extrato ===== */
function renderExtrato(){
  const box = $('#v-extrato');
  if (!box.dataset.ready){
    box.dataset.ready = '1';
    box.innerHTML = `<div class="stack">
      <label class="search">${ic('search')}<input id="extQ" type="search" placeholder="Buscar lançamento" autocomplete="off"></label>
      <div class="seg" id="extSeg"></div><div class="chips" id="extChips"></div>
      <div class="sum-line" id="extSum"></div><div id="extList"></div></div>`;
    $('#extQ').addEventListener('input', e => { ext.q = e.target.value; renderExtList(); });
  }
  $('#extQ').value = ext.q;
  $('#extSeg').innerHTML = [['all','Tudo'],['receita','Receitas'],['gasto','Gastos'],['pend','A pagar']]
    .map(([k,l])=>`<button class="${ext.tipo===k?'on':''}" data-act="ext-tipo" data-v="${k}">${l}</button>`).join('');
  const used = [...new Set(entries().map(e=>e.cat))];
  $('#extChips').innerHTML = `<button class="chip ${ext.cat==='all'?'on':''}" data-act="ext-cat" data-v="all">Todas</button>` +
    used.map(id=>{ const c = catOf(id); return `<button class="chip ${ext.cat===id?'on':''}" data-act="ext-cat" data-v="${esc(id)}">${c.emoji} ${esc(c.label)}</button>`; }).join('');
  renderExtList();
}
function renderExtList(){
  const q = ext.q.trim().toLowerCase();
  let es = entries().filter(e => {
    if (ext.tipo==='receita' && e.tipo!=='receita') return false;
    if (ext.tipo==='gasto' && e.tipo!=='gasto') return false;
    if (ext.tipo==='pend' && (e.pago || e.tipo!=='gasto')) return false;
    if (ext.cat!=='all' && e.cat!==ext.cat) return false;
    if (q && !(e.desc.toLowerCase().includes(q) || catOf(e.cat).label.toLowerCase().includes(q))) return false;
    return true;
  });
  es.sort((a,b)=> ext.tipo==='pend' ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date));
  const net = es.reduce((a,e)=>a+(e.tipo==='receita'?e.valor:-e.valor),0);
  $('#extSum').innerHTML = es.length ? `${es.length} ${es.length>1?'lançamentos':'lançamento'} · saldo <span class="money">${fmt(net)}</span>` : '';
  if (!es.length){
    $('#extList').innerHTML = `<div class="empty"><b>${q||ext.tipo!=='all'||ext.cat!=='all'?'Nada encontrado':'Sem lançamentos neste mês'}</b>${q||ext.tipo!=='all'||ext.cat!=='all'?'Tente mudar a busca ou os filtros.':'Toque no botão + para registrar um gasto ou uma receita.'}</div>`; return;
  }
  let html = '', cur = '';
  es.forEach(e => { if (e.date!==cur){ cur = e.date; html += `<div class="daysep">${dayLabel(e.date)}</div>`; } html += `<div class="card" style="padding:0 14px;border-radius:16px;margin-bottom:8px">${rowHtml(e,false)}</div>`; });
  $('#extList').innerHTML = html;
}

/* ===== Análises ===== */
async function loadHistory(){
  if (!isAuthenticated) return;
  let changed = false;
  for (let i=1;i<=5;i++){
    const [y,m] = addMonths(year,month,-i), k = key(y,m);
    if (histLoaded.has(k) || dirty.has(k) || loaded.has(k)) continue;
    try{ const rows = await fetchMonth(y,m); if (rows){ setEntries(y,m,rows); changed = true; } histLoaded.add(k); }catch{ break; }
  }
  if (changed && view==='analise') renderAnalise();
}
function renderAnalise(){
  const es = entries(), s = stats(es), by = spentByCat(es);
  const list = Object.entries(by).sort((a,b)=>b[1]-a[1]);
  let donut = '';
  if (s.gas>0){
    const R=54, C=2*Math.PI*R; let acc=0;
    const segs = list.map(([id,v])=>{ const len = v/s.gas*C; const el = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${catOf(id).color}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}"/>`; acc+=len; return el; }).join('');
    donut = `<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="Gastos por categoria">${segs}</svg><div><small>Gastos</small><b class="money">${fmt(s.gas)}</b></div></div>
      <div class="legend">${list.slice(0,6).map(([id,v])=>`<div><i style="background:${catOf(id).color}"></i><span>${esc(catOf(id).label)}</span><b>${Math.round(v/s.gas*100)}%</b></div>`).join('')}</div></div>
      <div style="margin-top:8px">${list.map(([id,v])=>{ const c=catOf(id); return `<div class="row"><span class="dot-ic" style="background:${c.color}22;width:36px;height:36px">${c.emoji}</span><span class="row-main"><b>${esc(c.label)}</b></span><span class="row-end"><b class="money">${fmt(v)}</b></span></div>`; }).join('')}</div>`;
  } else donut = `<div class="empty"><b>Sem gastos neste mês</b>Quando houver gastos, você vê aqui para onde o dinheiro foi.</div>`;

  const months = []; for (let i=5;i>=0;i--) months.push(addMonths(year,month,-i));
  const data = months.map(([y,m])=>({y,m,...stats(getEntries(y,m))}));
  const max = Math.max(1,...data.map(d=>Math.max(d.rec,d.gas)));
  const bars = data.map(d=>`<div class="bar-col ${d.y===year&&d.m===month?'cur':''}"><div class="bar-pair"><i style="height:${Math.max(2,d.rec/max*100)}%;background:var(--income)"></i><i style="height:${Math.max(2,d.gas/max*100)}%;background:var(--expense)"></i></div><small>${MONTHS[d.m]}</small></div>`).join('');
  const [py,pm] = addMonths(year,month,-1), prev = stats(getEntries(py,pm));
  let cmp = '';
  if (prev.gas>0 && s.gas>0){ const d = Math.round((s.gas-prev.gas)/prev.gas*100);
    cmp = `<p class="small" style="margin-top:10px">${d===0?'Gastos iguais aos de':`Você gastou <b>${Math.abs(d)}% ${d>0?'a mais':'a menos'}</b> que em`} ${MONTHS_FULL[pm]}.</p>`; }

  const pv = es.filter(e=>e.tipo==='gasto'&&e.quem==='victor').reduce((a,e)=>a+e.valor,0);
  const pc = es.filter(e=>e.tipo==='gasto'&&e.quem==='cris').reduce((a,e)=>a+e.valor,0);
  const pt = pv+pc;
  const who = pt>0 ? `<div class="card"><h3>Quem pagou os gastos</h3><div class="split-bar"><i style="width:${pv/pt*100}%;background:var(--victor)"></i><i style="width:${pc/pt*100}%;background:var(--cris)"></i></div>
    <div class="split-names"><div><b class="money">${fmt(pv)}</b><span class="muted">Victor</span></div><div style="text-align:right"><b class="money">${fmt(pc)}</b><span class="muted">Cris</span></div></div></div>` : '';
  $('#v-analise').innerHTML = `<div class="stack">
    <div class="card"><h3>Para onde foi o dinheiro</h3>${donut}</div>
    <div class="card"><h3>Últimos 6 meses</h3><div class="bars">${bars}</div>
      <div class="key"><span><i style="background:var(--income)"></i>Entrou</span><span><i style="background:var(--expense)"></i>Saiu</span></div>${cmp}</div>
    ${who}</div>`;
}

/* ===== Metas: orçamento e objetivos ===== */
function renderMetas(){
  const es = entries(), spent = spentByCat(es);
  const body = metasTab==='bud' ? budgetsHtml(spent) : goalsHtml();
  $('#v-metas').innerHTML = `<div class="stack"><div class="seg">

function budgetsHtml(spent){
  const cats = CATS.filter(c=>c.kind!=='receita');
  const lim = cats.filter(c=>cfg.budgets[c.id]>0);
  const tl = lim.reduce((a,c)=>a+cfg.budgets[c.id],0), ts = lim.reduce((a,c)=>a+(spent[c.id]||0),0);
  const head = lim.length ? `<div class="card"><div class="small muted">Nos limites definidos · toque numa categoria para ajustar</div><div style="font-size:1.3rem;font-weight:800" class="money">${fmt(ts)} <span class="muted" style="font-size:.9rem;font-weight:600">de ${fmt(tl)}</span></div>
    <div class="prog"><i class="${ts>tl?'bad':ts/tl>=.8?'warn':''}" style="width:${Math.min(100,ts/tl*100)}%"></i></div></div>`
    : `<div class="card empty" style="padding:20px"><b>Defina limites por categoria</b>Toque numa categoria abaixo para escolher quanto vocês querem gastar por mês. O app avisa quando chegar perto.</div>`;
  const rows = cats.sort((a,b)=>(cfg.budgets[b.id]>0)-(cfg.budgets[a.id]>0)).map(c=>{
    const l = cfg.budgets[c.id], s = spent[c.id]||0, p = l>0 ? s/l : 0;
    return `<div class="card" style="padding:14px 16px"><button class="bud-head" data-act="bud" data-id="${esc(c.id)}"><span>${c.emoji} ${esc(c.label)}</span>
      <span class="${l>0?'':'muted small'} money">${l>0?`${fmt(s)} / ${fmt(l)}`:(s>0?fmt(s):'Definir limite')}</span></button>
      ${l>0?`<div class="prog"><i class="${p>1?'bad':p>=.8?'warn':''}" style="width:${Math.min(100,p*100)}%"></i></div><div class="small muted">${p>1?`Passou ${'<span class="money">'+fmt(s-l)+'</span>'} do limite`:`Resta <span class="money">${fmt(l-s)}</span>`}</div>`:''}</div>`; }).join('');
  return head + rows;
}
function goalsHtml(){
  const t = new Date();
  const cards = cfg.goals.map(g=>{
    const p = g.target>0 ? Math.min(100,g.saved/g.target*100) : 0, left = Math.max(0,g.target-g.saved);
    let plan = '';
    if (left<=0) plan = '🎉 Meta alcançada!';
    else if (g.deadline){ const [dy,dm] = g.deadline.split('-').map(Number); const n = Math.max(1,(dy-t.getFullYear())*12+(dm-1-t.getMonth()));
      plan = `Guarde ${fmt(left/n)} por mês até ${MONTHS[dm-1]}/${dy}`; }
    return `<div class="goal"><div class="goal-top"><div><h4>${esc(g.name)}</h4><div class="small muted"><span class="money">${fmt(g.saved)}</span> de <span class="money">${fmt(g.target)}</span></div></div>
      <button class="btn soft small" data-act="goal-edit" data-id="${esc(g.id)}">Editar</button></div>
      <div class="prog"><i style="width:${p}%"></i></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="small muted">${plan||Math.round(p)+'% guardado'}</span>
      <button class="btn primary small" data-act="goal-dep" data-id="${esc(g.id)}">Guardar valor</button></div></div>`; }).join('');
  return (cards || `<div class="card empty"><b>Nenhum objetivo ainda</b>Uma viagem, a reserva de emergência, a entrada de um carro… crie uma meta e acompanhem juntos.</div>`)
    + `<button class="btn primary block" data-act="goal-new">Novo objetivo</button>`;
}

function updateParcelInfo(){

async function saveEntry(){
  if (!needAuth()) return;
  const valor = parseMoney($('#fValor').value), desc = $('#fDesc').value.trim(), date = $('#fData').value;
  if (!(valor>0)) return toast('Informe o valor');
  if (!desc) return toast('Informe a descrição');
  if (!date) return toast('Escolha a data');
  f.pago = $('#fPago').checked; if ($('#fDiv')) f.dividir = $('#fDiv').checked;
  if (f.rep==='parcel'){ f.n = Math.max(2,Math.min(36,parseInt($('#fN').value)||0)); if (f.n<2) return toast('Informe o número de parcelas'); }
  const base = {tipo:f.tipo, cat:f.cat, quem:f.quem, dividir:f.tipo==='gasto'&&f.dividir, pago:f.pago};
  const form = f; closeSheet(); toast('Salvando…');
  try{
    if (form.edit) await updateEntry(form.edit, {...base, desc, date, valor});
    else if (form.rep==='parcel') await createParcels(base, desc, date, valor, form.n);
    else await createEntry({...base, desc, date, valor, recorrente:form.rep==='month'});
    if (form.quem) { ME = form.quem; lsSet('vc_me', ME); }
    toast(form.edit?'Lançamento atualizado':form.rep==='parcel'?`${form.n} parcelas lançadas`:form.rep==='month'?'Lançamento fixo criado para os próximos meses':'Lançamento salvo');
  }catch(e){ if (errCode(e)===401) lostSession(); else toast('Não foi possível salvar: '+((e.result&&e.result.error&&e.result.error.message)||e.message||e)); }
  render();
}
const monthOf = date => { const [y,m] = date.split('-').map(Number); return [y,m-1]; };
async function createEntry(e){
  const [y,m] = monthOf(e.date); await ensureLoaded(y,m);
  const id = uid(); const list = getEntries(y,m); list.push({...e,id}); setEntries(y,m,list); markDirty(y,m); await flush();
  if (e.recorrente){
    const day = e.date.slice(8,10);
    for (let k=m+1;k<12;k++){
      await loadMonth(y,k); const l = getEntries(y,k);
      if (!l.some(x=>baseOf(x.id)===id)){ l.push({...e,id:id+'_r'+y+pad(k+1),date:ymd(y,k,Math.min(+day,daysIn(y,k))),pago:false}); setEntries(y,k,l); markDirty(y,k); await flush(); }
    }
  }
}
async function createParcels(b, desc, date, total, n){
  const [y0,m0] = monthOf(date), d0 = +date.slice(8,10), id = uid();
  const cents = Math.round(total*100), each = Math.floor(cents/n), rest = cents-each*n;
  for (let i=0;i<n;i++){
    const [y,m] = addMonths(y0,m0,i); await ensureLoaded(y,m);
    const l = getEntries(y,m);
    l.push({...b, id:id+'_p'+(i+1), desc:`${desc} (${i+1}/${n})`, date:ymd(y,m,Math.min(d0,daysIn(y,m))), valor:(each+(i===n-1?rest:0))/100, recorrente:false, pago:i===0?b.pago:false});
    setEntries(y,m,l); markDirty(y,m); await flush();
  }
}
async function updateEntry(old, nw){
  const [ty,tm] = monthOf(nw.date);
  if (ty===year && tm===month){
    setEntries(year,month,entries().map(x=>x.id===old.id?{...x,...nw}:x)); markDirty(year,month);
  } else {
    await ensureLoaded(ty,tm);
    setEntries(year,month,entries().filter(x=>x.id!==old.id)); markDirty(year,month);
    const l = getEntries(ty,tm); l.push({...old,...nw}); setEntries(ty,tm,l); markDirty(ty,tm);
  }
  await flush();
}
function askDelete(){
  const e = f && f.edit; if (!e) return;
  const series = e.recorrente || /_p\d+$/.test(e.id);
  window._delId = e.id;
  openSheet(`<h2>Excluir “${esc(e.desc)}”?</h2>
    <p class="muted small" style="margin-bottom:6px">${series?(e.recorrente?'Este lançamento se repete todo mês.':'Este lançamento é uma parcela.'):'Essa ação não pode ser desfeita.'}</p>
    <div class="actions" style="flex-direction:column">
      <button class="btn danger" data-act="del-one">${series?'Só este mês':'Excluir'}</button>
      ${series?`<button class="btn danger" data-act="del-series">${e.recorrente?'Este e os próximos meses':'Esta e as próximas parcelas'}</button>`:''}
      <button class="btn soft" data-act="close">Cancelar</button></div>`);
}
async function deleteEntry(all){
  if (!needAuth()) return;
  const e = entries().find(x=>x.id===window._delId); closeSheet(); if (!e) return;
  toast('Excluindo…');
  try{
    setEntries(year,month,entries().filter(x=>x.id!==e.id)); markDirty(year,month); await flush();
    if (all){
      const isParcel = /_p\d+$/.test(e.id), base = baseOf(e.id), idx = isParcel ? +e.id.match(/_p(\d+)$/)[1] : 0;
      for (let k=1;k<=36;k++){
        const [y,m] = addMonths(year,month,k);
        const rows = await fetchMonth(y,m); if (rows===null) break;
        const keep = rows.filter(x => !(baseOf(x.id)===base && (isParcel ? (+(x.id.match(/_p(\d+)$/)||[0,0])[1])>=idx : x.recorrente)));
        if (keep.length===rows.length){ if (isParcel) break; continue; }
        setEntries(y,m,keep); loaded.add(key(y,m)); markDirty(y,m); await flush();
      }
    }
    toast(all?'Excluído deste mês em diante':'Lançamento excluído');
  }catch(err){ if (errCode(err)===401) lostSession(); else toast('Não foi possível excluir'); }
  render();
}
function togglePay(id){
  if (!needAuth()) return;
  const l = entries(), e = l.find(x=>x.id===id); if (!e) return;
  e.pago = !e.pago; setEntries(year,month,l); markDirty(year,month); render();

}

  'ext-tipo':d=>{ ext.tipo=d.v; renderExtrato(); }, 'ext-cat':d=>{ ext.cat=d.v; renderExtrato(); },
  'metas-tab':d=>{ metasTab=d.v; renderMetas(); },
  'f-tipo':d=>{ f.tipo=d.v; if (!catsFor(f.tipo).some(c=>c.id===f.cat)) f.cat=(catsFor(f.tipo)[0]||{}).id; if (f.tipo==='receita'&&f.rep==='parcel') f.rep='once'; f.pago=$('#fPago')?$('#fPago').checked:f.pago; drawForm(); },
  'f-cat':d=>{ f.cat=d.v; $('#fCats').querySelectorAll('.cat-opt').forEach(b=>b.classList.toggle('on',b.dataset.v===d.v)); },
  'f-quem':d=>{ f.quem=d.v; drawForm(); }, 'f-rep':d=>{ f.pago=$('#fPago').checked; if ($('#fDiv')) f.dividir=$('#fDiv').checked; f.rep=d.v; drawForm(); },
  'save-entry':saveEntry, 'del-ask':askDelete, 'del-one':()=>deleteEntry(false), 'del-series':()=>deleteEntry(true), close:closeSheet,
  bud:d=>openBudget(d.id),
  'bud-save':d=>{ const v = parseMoney($('#bVal').value); if (!(v>0)) return toast('Informe um valor maior que zero'); cfg.budgets[d.id]=v; commitCfg(); closeSheet(); render(); },
  'bud-del':d=>{ delete cfg.budgets[d.id]; commitCfg(); closeSheet(); render(); },
  'goal-new':()=>openGoal(null), 'goal-edit':d=>openGoal(d.id), 'goal-dep':d=>openDeposit(d.id),
  'goal-save':d=>{
    const name=$('#gName').value.trim(), target=parseMoney($('#gTarget').value), date=$('#gDate').value;
    if (!name) return toast('Dê um nome ao objetivo'); if (!(target>0)) return toast('Informe quanto precisam juntar');
    if (d.id){ const g=cfg.goals.find(x=>x.id===d.id); Object.assign(g,{name,target,deadline:date}); }
    else cfg.goals.push({id:uid(),name,target,saved:Math.max(0,parseMoney(($('#gSaved')||{}).value)||0),deadline:date});
    commitCfg(); closeSheet(); render(); toast('Objetivo salvo'); },
  'goal-del':d=>{ cfg.goals = cfg.goals.filter(x=>x.id!==d.id); commitCfg(); closeSheet(); render(); toast('Objetivo excluído'); },
  'goal-dep-save':d=>{ const v=parseMoney($('#dVal').value); if (isNaN(v)||v===0) return toast('Informe um valor');
    const g=cfg.goals.find(x=>x.id===d.id); g.saved=Math.max(0,g.saved+v); commitCfg(); closeSheet(); render(); toast(g.saved>=g.target?'Meta alcançada! 🎉':'Valor guardado'); },
  more:openMore, me:d=>{ ME=d.v; lsSet('vc_me',ME); openMore(); },
  theme:d=>{ lsSet('vc_theme',d.v); applyTheme(); openMore(); },
  cats:openCats,
  'cat-add':()=>{
    const label=$('#cName').value.trim(); if (!label) return toast('Digite o nome da categoria');
    const id=label.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||uid();
    if (CATS.some(c=>c.id===id)) return toast('Essa categoria já existe');
    CATS.push({id,label,emoji:$('#cEmoji').value.trim()||'📌',color:$('#cColor').value,kind:$('#cKind').value}); commitCfg(); openCats(); toast('Categoria criada'); },
  'cat-del':d=>{ CATS = CATS.filter(c=>c.id!==d.id); delete cfg.budgets[d.id]; commitCfg(); openCats(); toast('Categoria removida. Lançamentos antigos ficam como “Sem categoria”.'); },
  sync:()=>{ closeSheet(); syncNow(); }, csv:()=>{ closeSheet(); exportCSV(); },
  signout:signOut, login:()=>{ closeSheet(); loginClick(); },
  'mp-y':d=>window._mpDraw(+d.d), 'mp-pick':d=>{ closeSheet(); goMonth(+d.y,+d.m); },
};
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (t && ACT[t.dataset.act]){ ACT[t.dataset.act](t.dataset,t); return; }
  const n = ev.target.closest('#nav [data-v]'); if (n) setView(n.dataset.v);
  if (ev.target.id==='backdrop') closeSheet();
});
document.addEventListener('input', ev => { if (ev.target.id==='fValor' || ev.target.id==='fN') updateParcelInfo(); });
document.addEventListener('keydown', ev => { if (ev.key==='Escape') closeSheet(); if (ev.key==='Enter' && ev.target.matches('#fValor,#fDesc')) { ev.preventDefault(); saveEntry(); } });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState==='hidden'){ if (dirty.size||cfgDirty) flush(); }
  else if (isAuthenticated && !dirty.size && !cfgDirty && !$('#backdrop').classList.contains('on')){
    loadMonth(year,month).then(()=>{ setSync('ok','Atualizado '+hm()); render(); }).catch(()=>{});
  }
});
window.addEventListener('pagehide', () => { if (dirty.size||cfgDirty) flush(); });

function init(){
  $('#nav').innerHTML =
    `<button data-v="home">${ic('home')}Início</button><button data-v="extrato">${ic('list')}Extrato</button>
     <button class="fab" id="btnAdd" aria-label="Novo lançamento">${ic('plus')}</button>
     <button data-v="analise">${ic('chart')}Análises</button><button data-v="metas">${ic('target')}Metas</button>`;
  $('#btnAdd').onclick = () => openEntry(null);
  $('#btnPrev').innerHTML = ic('left'); $('#btnNext').innerHTML = ic('right'); $('#btnMore').innerHTML = ic('sliders');
  $('#btnPrev').onclick = () => goMonth(...addMonths(year,month,-1));
  $('#btnNext').onclick = () => goMonth(...addMonths(year,month,1));
  $('#btnMonth').onclick = openMonthPicker;
  $('#btnMore').onclick = openMore;
  $('#btnEye').onclick = () => { lsSet('vc_hide', lsGet('vc_hide','0')==='1'?'0':'1'); applyHide(); render(); };
  $('#btnLogin').onclick = loginClick;
  applyTheme(); applyHide(); setSync('busy','Conectando…'); render();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  setTimeout(() => { if (!isAuthenticated && !gapiReady) { setSync('err','Sem conexão'); } }, 8000);
}
init();
</script>
<script src="https://apis.google.com/js/api.js?onload=gapiLoaded"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
